<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
<style>
  .ms { font-family:'Material Symbols Rounded'; font-weight:400; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; direction:ltr; }
  body { margin:0; background:#e8e9e6; font-family:'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; }
  a { color:#0d7a70; text-decoration:none; }
  a:hover { color:#0a5d55; text-decoration:underline; }
  input { font-family:inherit; }
  *::-webkit-scrollbar { width:11px; }
  *::-webkit-scrollbar-thumb { background:#c1c5c0; }
  *::-webkit-scrollbar-track { background:#eef0ec; }
</style>
</helmet>

<div style="width:1600px; height:900px; overflow:hidden; background:#e8e9e6; font-family:'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; color:#1c1f1d; display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; gap:10px; height:34px; padding:0 20px; background:#123c3a; color:#dfe9e6; font-size:12.5px; font-weight:600; letter-spacing:0.02em; flex:none;">
    <span>Portal Formulir Elektronik</span>
    <div style="flex:1"></div>
    <span style="font-size:11px; color:#8fb5ae;">RSUD Demang Sepulau Raya</span>
  </div>

  <div style="display:flex; align-items:center; gap:12px; padding:14px 24px; background:#ffffff; border-bottom:1px solid #cfd3ce; flex:none;">
    <span style="font-size:16px; font-weight:600; letter-spacing:-0.01em;">Daftar Formulir</span>
    <div style="flex:1"></div>
    <div style="display:flex; align-items:center; border:1px solid #cfd3ce; border-radius:2px; background:#fff; padding:0 10px;">
      <span class="ms" style="font-size:17px; color:#8b928d;">search</span>
      <input type="text" placeholder="Cari formulir…" value="{{ cari }}" onChange="{{ setCari }}" style="width:240px; border:none; padding:8px 8px; font-size:12.5px; outline:none;">
    </div>
  </div>

  <div style="flex:1; min-height:0; overflow-y:auto; padding:20px 24px;">
    <sc-for list="{{ grup }}" as="g" hint-placeholder-count="4">
      <div style="margin-bottom:26px;">
        <div style="display:flex; align-items:baseline; gap:10px; margin-bottom:12px;">
          <span style="font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#5d645f;">{{ g.nama }}</span>
          <div style="flex:1; height:1px; background:#d8dbd6;"></div>
        </div>
        <div style="display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:14px;">
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="5">
            <div style="{{ it.cardStyle }}" style-hover="border-color:#0d7a70; box-shadow:0 1px 4px rgba(13,122,112,0.12);">
              <div style="{{ it.iconWrapStyle }}"><span class="ms" style="font-size:24px; color:#0d7a70;">{{ it.icon }}</span></div>
              <span style="font-size:12.5px; font-weight:500; color:#1c1f1d; line-height:1.4; text-align:center;">{{ it.label }}</span>
              <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}">
                <span style="font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:#9aa19c;">{{ it.badge }}</span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const GRUP = [
  { nama: 'Persetujuan & Penolakan', items: [
    ['Persetujuan Umum','fact_check'], ['Persetujuan/Penolakan Tindakan','rule'],
    ['Persetujuan Transfer Antar Ruang','sync_alt'], ['Persetujuan Rawat Inap','bed'],
    ['Persetujuan Penundaan Pelayanan','schedule'], ['Penolakan Anjuran Medis','block'],
    ['Persetujuan Restrain','link'], ['Persetujuan Bimbingan Rohani & Mental','self_improvement'],
    ['Bukti Persetujuan Pemeriksaan HIV','biotech','RM'], ['Penolakan Resusitasi','heart_broken']
  ]},
  { nama: 'Pernyataan Pasien', items: [
    ['Pernyataan Pasien Umum','badge'], ['Pernyataan Pulang Atas Permintaan Sendiri','exit_to_app'],
    ['Pernyataan Memilih DPJP','person_search'], ['Permintaan Second Opinion','forum'],
    ['Permintaan Perlindungan Dari Kekerasan','shield'], ['Permohonan Privasi Pasien','lock']
  ]},
  { nama: 'Bukti Pelaksanaan & Layanan', items: [
    ['Perencanaan Pemulangan Pasien','event_available'], ['Penyerahan Resep Rawat Jalan','medication'],
    ['Bukti Pelaksanaan Informasi & Edukasi','menu_book'], ['Bukti Pelayanan Kedokteran Fisik & Rehabilitasi','accessibility_new'],
    ['Bukti Pelayanan Program KFR','fitness_center'], ['Serah Terima Anggota Tubuh/Barang','inventory_2'],
    ['Pengajuan Cuti Perawatan','event_busy']
  ]},
  { nama: 'Catatan', items: [
    ['Catatan Perawat/Bidan','description','RM 32']
  ]}
];

class Component extends DCLogic {
  state = { cari: '' };
  renderVals() {
    const q = (this.state.cari || '').trim().toLowerCase();
    const grup = GRUP.map(g => ({
      nama: g.nama,
      items: g.items.filter(([label]) => !q || label.toLowerCase().includes(q)).map(([label, icon, badge]) => ({
        label, icon, badge: badge || '',
        cardStyle: { display:'flex', flexDirection:'column', alignItems:'center', gap:10, padding:'18px 12px 14px', border:'1px solid #dcdfda', borderRadius:3, background:'#ffffff', cursor:'pointer', minHeight:110, justifyContent:'center' },
        iconWrapStyle: { width:46, height:46, borderRadius:2, background:'#e9f5f2', display:'flex', alignItems:'center', justifyContent:'center' }
      }))
    })).filter(g => g.items.length);
    return {
      cari: this.state.cari, setCari: (e) => this.setState({ cari: e.target.value }),
      grup
    };
  }
}
</script>
</body>
</html>
