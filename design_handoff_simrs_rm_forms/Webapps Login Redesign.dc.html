<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
<style>
  .ms { font-family:'Material Symbols Rounded'; font-weight:400; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; direction:ltr; }
  body { margin:0; background:#e8e9e6; font-family:'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; }
  a { color:#0d7a70; text-decoration:none; }
  a:hover { color:#0a5d55; text-decoration:underline; }
  input { font-family:inherit; }
</style>
</helmet>

<div style="width:1600px; height:900px; overflow:hidden; background:#e8e9e6; font-family:'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; color:#1c1f1d; display:flex; flex-direction:column;">

  <div style="height:34px; background:#123c3a; flex:none;"></div>

  <div style="flex:1; display:flex; align-items:center; justify-content:center;">
    <div style="width:360px; display:flex; flex-direction:column; align-items:center; gap:22px;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="width:56px; height:56px; border-radius:2px; background:#e9f5f2; display:flex; align-items:center; justify-content:center;">
          <span class="ms" style="font-size:30px; color:#0d7a70;">local_hospital</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
          <span style="font-size:15px; font-weight:600; letter-spacing:-0.01em; text-align:center;">RSUD Demang Sepulau Raya</span>
          <span style="font-size:11.5px; color:#9aa19c;">Portal Formulir Elektronik</span>
        </div>
      </div>

      <div style="width:100%; border:1px solid #dcdfda; border-radius:3px; background:#ffffff; padding:24px; display:flex; flex-direction:column; gap:14px;">
        <div style="display:flex; flex-direction:column; gap:5px;">
          <span style="font-size:10.5px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:#9aa19c;">User Login</span>
          <input type="text" value="{{ user }}" onChange="{{ setUser }}" placeholder="Nama pengguna" style="height:36px; padding:0 11px; border:1px solid #cfd3ce; border-radius:2px; font-size:13px; outline:none;">
        </div>
        <div style="display:flex; flex-direction:column; gap:5px;">
          <span style="font-size:10.5px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:#9aa19c;">Password</span>
          <input type="password" value="{{ pass }}" onChange="{{ setPass }}" placeholder="Kata sandi" style="height:36px; padding:0 11px; border:1px solid #cfd3ce; border-radius:2px; font-size:13px; outline:none;">
        </div>
        <div style="display:flex; gap:8px; padding-top:4px;">
          <div style="flex:1; height:38px; display:flex; align-items:center; justify-content:center; border:1px solid #cfd3ce; border-radius:2px; font-size:13px; font-weight:500; color:#5d645f; cursor:pointer; background:#fff;" style-hover="border-color:#9aa19c;">Batal</div>
          <div style="flex:2; height:38px; display:flex; align-items:center; justify-content:center; gap:7px; border-radius:2px; background:#0d7a70; color:#fff; font-size:13px; font-weight:600; cursor:pointer;" style-hover="filter:brightness(0.92);"><span class="ms" style="font-size:16px;">login</span>Log-In</div>
        </div>
      </div>

      <span style="font-size:11px; color:#a8b0ab;">Akses menggunakan akun yang terdaftar di sistem SIMRS</span>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { user:'', pass:'' };
  renderVals() {
    return {
      user: this.state.user, setUser:(e)=>this.setState({user:e.target.value}),
      pass: this.state.pass, setPass:(e)=>this.setState({pass:e.target.value})
    };
  }
}
</script>
</body>
</html>
